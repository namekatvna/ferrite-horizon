[workspace]
resolver = "3"
members = [
    "crates/ferrite-api",
    "crates/ferrite-macros",
    "crates/ferrite-common",
    "crates/cargo-ferrite",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/namekatvna/ferrite-horizon"
authors = ["Vadym Morozov"]

[workspace.dependencies]
ferrite-api = { path = "crates/ferrite-api", version = "0.0.1" }
ferrite-macros = { path = "crates/ferrite-macros", version = "0.0.1" }
ferrite-common = { path = "crates/ferrite-common", version = "0.0.1" }
horizon-mod-sdk = { git = "https://github.com/horizon-rust/horizon", rev = "cba52f4e5d7f99c592a26823fe8727beafe6ebff" }

[profile.release]
opt-level = "s"
lto = true
