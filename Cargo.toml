[workspace]
resolver = "3"
members = [
    "crates/ferrite-api",
    "crates/ferrite-macros",
    "crates/ferrite-common",
    "crates/cargo-ferrite",
    "examples/hello",
    "examples/compass",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/namekatvna/ferrite-horizon"
authors = ["Vadym Morozov"]

[workspace.dependencies]
ferrite-api = { path = "crates/ferrite-api", version = "0.0.1" }
ferrite-macros = { path = "crates/ferrite-macros", version = "0.0.1" }
ferrite-common = { path = "crates/ferrite-common", version = "0.0.1" }
postcard = { version = "1", default-features = false, features = ["alloc"] }
proc-macro2 = "1"
quote = "1"
serde = "1"
serde_json = "1"
syn = "2"
wit-bindgen = { version = "0.60.0", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
