[workspace]
resolver = "3"
members = [
    "crates/ferrite-api",
    "crates/ferrite-macros",
    "crates/ferrite-common",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/namekatana/ferrite-horizon"
authors = ["Vadym Morozov"]

[workspace.dependencies]
ferrite-api = { path = "crates/ferrite-api", version = "0.0.1" }
ferrite-macros = { path = "crates/ferrite-macros", version = "0.0.1" }
ferrite-common = { path = "crates/ferrite-common", version = "0.0.1" }

[profile.release]
opt-level = "s"
lto = true
