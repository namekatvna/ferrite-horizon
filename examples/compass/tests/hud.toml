player = { x = -0.5, y = 64.2, z = 10.9, yaw = 180.0, dimension = "minecraft:overworld" }
clock = { day-time = 6500 }

[[step]]
expect.commands = ["compass", "day"]

[[step]]
ticks = 1
expect.panel = ["XYZ -1 64 10", "Facing North", "Overworld 12:30"]
