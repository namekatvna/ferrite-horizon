player = { x = 100.0, yaw = -90.0, dimension = "minecraft:the_nether" }
clock = { day-time = 42000 }
ticks = 1
expect.panel = ["XYZ 100 64 10", "Facing East", "Nether 00:00"]

[[step]]
title-screen = true
ticks = 1
